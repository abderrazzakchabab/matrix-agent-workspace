services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: matrix-test-postgres
    environment:
      POSTGRES_USER: matrix
      POSTGRES_PASSWORD: matrix_test_password
      POSTGRES_DB: matrix_test
    ports:
      - '5432:5432'
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U matrix -d matrix_test']
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 3s

  synapse:
    image: matrixdotorg/synapse:v1.158.0
    container_name: matrix-test-synapse
    environment:
      SYNAPSE_SERVER_NAME: example.test
      SYNAPSE_REPORT_STATS: 'no'
    ports:
      - '8008:8008'
    volumes:
      - ./synapse/homeserver.yaml:/data/homeserver.yaml:ro
      - ./synapse/runtime:/data/runtime
      - ../tests/fixtures/synapse:/tests/fixtures/synapse:ro
    # Generate signing key material at fixture startup only, under the ignored
    # host path infra/synapse/runtime/. No key material is committed.
    entrypoint: >
      sh -c 'test -f /data/runtime/example.test.signing.key ||
             generate_signing_key -o /data/runtime/example.test.signing.key;
             chown -R 991:991 /data/runtime;
             exec /start.py'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8008/_matrix/client/versions || exit 1']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  model:
    image: node:22-alpine
    container_name: matrix-test-model
    working_dir: /app
    command: ['node', '--experimental-strip-types', 'tests/fixtures/model/server.ts']
    environment:
      MODEL_FIXTURE_PORT: '4010'
    ports:
      - '4010:4010'
    volumes:
      - ..:/app:ro
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4010/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s

  github:
    image: node:22-alpine
    container_name: matrix-test-github
    working_dir: /app
    command: ['node', '--experimental-strip-types', 'tests/fixtures/github/server.ts']
    environment:
      GITHUB_FIXTURE_PORT: '4020'
    ports:
      - '4020:4020'
    volumes:
      - ..:/app:ro
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4020/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s

  inngest:
    image: inngest/inngest@sha256:0ad9d99466d3a6e0141bc2eea5834eb3f334500b5097d757c82d228d37efa884
    container_name: matrix-test-inngest
    # CONTROL_PLANE_PORT selects the host port the control plane dev server
    # listens on; it defaults to 3000 and only needs overriding when a
    # foreign process occupies that port on the fixture host.
    command:
      - inngest
      - dev
      - --sdk-url
      - http://host.docker.internal:${CONTROL_PLANE_PORT:-3000}/api/inngest
      - --poll-interval
      - '1'
      - --retry-interval
      - '1'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '8288:8288'
