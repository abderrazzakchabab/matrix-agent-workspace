services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: matrix-test-postgres
    environment:
      POSTGRES_USER: matrix
      POSTGRES_PASSWORD: matrix_test_password
      POSTGRES_DB: matrix_test
    ports:
      - '5432:5432'
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U matrix -d matrix_test']
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 3s
