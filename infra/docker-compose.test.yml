services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: matrix-test-postgres
    environment:
      POSTGRES_USER: matrix
      POSTGRES_PASSWORD: matrix_test_password
      POSTGRES_DB: matrix_test
    ports:
      - '5432:5432'
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U matrix -d matrix_test']
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 3s

  synapse:
    image: matrixdotorg/synapse:v1.158.0
    container_name: matrix-test-synapse
    environment:
      SYNAPSE_SERVER_NAME: example.test
      SYNAPSE_REPORT_STATS: 'no'
    ports:
      - '8008:8008'
    volumes:
      - ./synapse/homeserver.yaml:/data/homeserver.yaml:ro
      - ./synapse/runtime:/data/runtime
      - ../tests/fixtures/synapse:/tests/fixtures/synapse:ro
    # Generate signing key material at fixture startup only, under the ignored
    # host path infra/synapse/runtime/. No key material is committed.
    entrypoint: >
      sh -c 'test -f /data/runtime/example.test.signing.key ||
             generate_signing_key -o /data/runtime/example.test.signing.key;
             chown -R 991:991 /data/runtime;
             exec /start.py'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8008/_matrix/client/versions || exit 1']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
